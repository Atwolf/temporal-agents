[project]
name = "temporal-agents"
version = "0.1.0"
description = "Durable multi-agent workflows with Temporal + LangChain supervisor pattern"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "temporalio>=1.9.0",
    "langchain>=0.3.0",
    "langgraph>=0.4.0",
    "langchain-anthropic>=0.3.0",
    "langchain-mcp-adapters>=0.1.0",
    "langchain-chroma>=0.2.0",
    "chromadb>=0.5.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20.0",
    "fastmcp>=2.0",
]

[project.optional-dependencies]
ui = [
    "langgraph-cli[inmem]>=0.1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
